name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm run test

      # The design mandate and the .env-example guard are machine-enforced
      # precisely so a well-reviewed change cannot quietly break them.
      - name: Design mandate
        run: npm run lint:design

      - name: Template contains no secrets
        run: npm run lint:env

      # Static RLS structure check. It proves the policies EXIST — it cannot
      # prove they behave; the pgTAP job below is the one that does.
      - name: RLS structure
        run: npm run check:rls

      - name: Build
        run: npm run build

  a11y:
    name: WCAG 2.1 AA audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Start the production server
        run: |
          npm run build
          npx next start -p 3111 &
          npx wait-on http://localhost:3111 -t 60000

      # Runs axe-core over 16 pages in both colour schemes. Without Supabase
      # configured the portal renders its demo path, which is what the audit
      # has always covered.
      - name: Audit
        run: npm run audit:a11y
        env:
          A11Y_BASE_URL: http://localhost:3111

  # The security gate. Requires project credentials as repository secrets; the
  # job is skipped rather than failed when they are absent, so a fork or a
  # fresh clone still gets the other two jobs.
  rls:
    name: RLS isolation (pgTAP)
    runs-on: ubuntu-latest
    needs: check
    # Guards on the same secret the job actually consumes — a mismatch here
    # would run the job with empty credentials instead of skipping it.
    if: ${{ secrets.SUPABASE_DB_PASSWORD != '' && secrets.SUPABASE_PROJECT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run the isolation suite
        run: supabase test db
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
